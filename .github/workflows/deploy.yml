name: Deploy to GitHub Pages

# Builds the site as a static export and publishes it to GitHub Pages.
# Enable once in the repo: Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token that the Pages deploy action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STATIC_EXPORT: "true"
      # Project site lives under /<repo>/. If you later add a custom domain,
      # set NEXT_PUBLIC_BASE_PATH to "" and NEXT_PUBLIC_SITE_URL to that domain.
      NEXT_PUBLIC_BASE_PATH: /moksite
      NEXT_PUBLIC_SITE_URL: https://moki-s.github.io/moksite
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GitHub Pages is static-only: it can't run the /api/contact server route.
      # Drop it from THIS build so `output: export` succeeds. The source file
      # stays in the repo; on the live site the contact form falls back to its
      # built-in mailto link.
      - name: Remove server-only routes for static export
        run: rm -rf src/app/api

      - name: Build static export
        run: pnpm build

      # Stop Pages from running Jekyll, which would drop Next's _next/ assets.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
