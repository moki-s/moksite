name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: typecheck · lint · build · e2e · lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: E2E — Playwright (chromium + webkit) + axe (§9, §12)
        run: pnpm test:e2e

      - name: Lighthouse CI — §2 thresholds (perf ≥85 mobile, a11y ≥95, SEO 100)
        run: |
          pnpm start &
          for i in $(seq 1 30); do curl -sf http://localhost:3000 >/dev/null 2>&1 && break; sleep 1; done
          set -o pipefail
          if ! pnpm exec lhci autorun --config=./lighthouserc.json --collect.startServerCommand="" 2>&1 | tee lhci-output.txt; then
            # surface the assertion detail as a public annotation + step summary
            # (the raw job log requires repo auth to download)
            DETAIL=$(tail -60 lhci-output.txt | tr -d '\r')
            echo "## Lighthouse CI failure" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$DETAIL" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=lhci assertions::${DETAIL//$'\n'/ | }"
            exit 1
          fi
